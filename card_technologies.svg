<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>

    <!-- Cyber Amber Industrial Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b25" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ffb703" />
    </linearGradient>

    <!-- Laser Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="industrialGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.8" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1.5" fill="#ff7b25" fill-opacity="0.25" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="520" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="520" fill="url(#industrialGrid)" rx="16" />
  <rect width="1196" height="516" x="2" y="2" fill="none" stroke="#ff7b25" stroke-width="1.5" stroke-opacity="0.35" rx="14" />

  <!-- Top Decorative Circuit Trace -->
  <path d="M 40 40 L 280 40 L 310 70 L 600 70 L 620 50 L 1160 50" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.3" />
  <circle cx="280" cy="40" r="3.5" fill="#00f0ff" />
  <circle cx="600" cy="70" r="3.5" fill="#ff7b25" />
  <circle cx="1160" cy="50" r="4" fill="#00f0ff" filter="url(#cyanGlow)" />

  <!-- Header Section -->
  <g transform="translate(60, 85)">
    <!-- FIAP & Turma 1ECR Badges -->
    <rect x="0" y="0" width="80" height="28" rx="6" fill="#1f293d" stroke="#ff7b25" stroke-width="1.2" />
    <text x="40" y="19" fill="#ff7b25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">FIAP</text>

    <!-- Turma 1ECR Badge (100px width, centered) -->
    <rect x="95" y="0" width="100" height="28" rx="6" fill="#1f293d" stroke="#00f0ff" stroke-width="1.2" />
    <text x="145" y="19" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">1ECR</text>

    <rect x="210" y="0" width="135" height="28" rx="6" fill="#1f293d" stroke="#f59e0b" stroke-width="1" />
    <text x="277" y="18" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ENG. COMPUTAÇÃO</text>

    <!-- Title and Subtitle -->
    <text x="0" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">INDÚSTRIA 4.0</text>
    <text x="320" y="75" fill="url(#amberGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">• SMART FACTORY</text>
    
    <text x="0" y="108" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Automação Industrial, IIoT, Robótica 2-DOF, Edge Computing e Modelagem Matemática Symbolab
    </text>
  </g>

  <!-- Metric Hub Cards -->
  <g transform="translate(60, 240)">
    <!-- Card 1: OEE Mundial -->
    <g transform="translate(0, 0)">
      <rect width="250" height="130" rx="12" fill="#111827" stroke="#ff7b25" stroke-width="1.5" stroke-opacity="0.6" />
      <rect width="250" height="4" rx="2" fill="url(#amberGrad)" />
      <text x="20" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">EFICIÊNCIA OEE</text>
      <text x="20" y="75" fill="#ff7b25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="900">85.0%</text>
      <text x="20" y="105" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">World Class Manufacturing</text>
    </g>

    <!-- Card 2: Redução MQTT -->
    <g transform="translate(275, 0)">
      <rect width="250" height="130" rx="12" fill="#111827" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6" />
      <rect width="250" height="4" rx="2" fill="url(#cyanGrad)" />
      <text x="20" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">BANDA IIoT (MQTT vs HTTP)</text>
      <text x="20" y="75" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="900">-92.9%</text>
      <text x="20" y="105" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">Header Overhead Reduction</text>
    </g>

    <!-- Card 3: Precisão CNC -->
    <g transform="translate(550, 0)">
      <rect width="250" height="130" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6" />
      <rect width="250" height="4" rx="2" fill="#f59e0b" />
      <text x="20" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">RESOLUÇÃO DE PASSO</text>
      <text x="20" y="75" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="900">0.088°</text>
      <text x="20" y="105" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">Motor 28BYJ-48 Half-Step</text>
    </g>

    <!-- Card 4: Edge Processing -->
    <g transform="translate(825, 0)">
      <rect width="255" height="130" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
      <rect width="255" height="4" rx="2" fill="#10b981" />
      <text x="20" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">LATÊNCIA NA BORDA</text>
      <text x="20" y="75" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="900">&lt; 1.0 ms</text>
      <text x="20" y="105" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">ESP32 Dual-Core 240MHz</text>
    </g>
  </g>

  <!-- Bottom Technology Badges -->
  <g transform="translate(60, 420)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="135" height="34" rx="8" fill="#1a2333" stroke="#ff7b25" stroke-width="1" />
    <text x="67" y="22" fill="#ff7b25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle">⚙️ CLP &amp; Motores</text>

    <!-- Badge 2 -->
    <rect x="150" y="0" width="145" height="34" rx="8" fill="#1a2333" stroke="#00f0ff" stroke-width="1" />
    <text x="222" y="22" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle">📡 LoRaWAN / ZigBee</text>

    <!-- Badge 3 -->
    <rect x="310" y="0" width="140" height="34" rx="8" fill="#1a2333" stroke="#38bdf8" stroke-width="1" />
    <text x="380" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle">⚡ Broker MQTT</text>

    <!-- Badge 4 -->
    <rect x="465" y="0" width="145" height="34" rx="8" fill="#1a2333" stroke="#f59e0b" stroke-width="1" />
    <text x="537" y="22" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle">🦾 Robótica 2-DOF</text>

    <!-- Badge 5 -->
    <rect x="625" y="0" width="145" height="34" rx="8" fill="#1a2333" stroke="#ec4899" stroke-width="1" />
    <text x="697" y="22" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle">📊 Regressão &amp; MRP</text>

    <!-- Badge 6 -->
    <rect x="785" y="0" width="165" height="34" rx="8" fill="#1a2333" stroke="#10b981" stroke-width="1" />
    <text x="867" y="22" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle">📐 Symbolab Step-by-Step</text>

    <!-- Badge 7 -->
    <rect x="965" y="0" width="115" height="34" rx="8" fill="#1a2333" stroke="#a855f7" stroke-width="1" />
    <text x="1022" y="22" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle">💻 C++ &amp; Python</text>
  </g>
</svg>
